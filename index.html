<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lúmina — Aldea IA</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="hud">
    <div class="title">LÚMINA</div>
    <div class="subtitle">Aldea IA · Día 1 · Velocidad 1x</div>
  </div>
  <div id="status">1 dedo: mirar · 2 dedos: zoom · Botones: mover</div>
  <div id="controls" aria-label="Controles de cámara">
    <button data-move="w" aria-label="Avanzar">▲</button>
    <button data-move="a" aria-label="Mover izquierda">◀</button>
    <button data-move="s" aria-label="Retroceder">▼</button>
    <button data-move="d" aria-label="Mover derecha">▶</button>
  </div>
  <div id="app"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
