,sans-serif;white-space:pre-wrap;box-sizing:border-box'}if(hud)hud.textContent='Lúmina · DIAGNÓSTICO: '+window.__luminaBoot.stage}window.addEventListener('error',e=>{const m=e.error?.stack||e.message||'error desconocido';window.__luminaBoot.errors.push(m);showBootError(m)});window.addEventListener('unhandledrejection',e=>{const m=e.reason?.stack||String(e.reason||'promesa rechazada');window.__luminaBoot.errors.push(m);showBootError(m)});bootStage('HTML cargado · esperando módulo principal');setTimeout(()=>{if(window.__luminaBoot.stage==='HTML cargado · esperando módulo principal'||window.__luminaBoot.stage==='Importando main-stable.js')showBootError('El módulo principal no terminó de arrancar. Posible fallo de módulo/CDN o ejecución bloqueada.')},10000)</script><script type="module">try{bootStage('Probando Three.js local');await import('./src/three.module.js?v=30');bootStage('Three.js OK · probando world.js');await import('./src/world.js?v=30');bootStage('world.js OK · probando agents.js');await import('./src/agents.js?v=30');bootStage('agents.js OK · probando simulation.js');await import('./src/simulation.js?v=30');bootStage('simulation.js OK · probando movement.js');await import('./src/movement.js?v=30');bootStage('movement.js OK · probando spatial.js');await import('./src/spatial.js?v=30');bootStage('spatial.js OK · probando village.js');await import('./src/village.js?v=30');bootStage('Dependencias OK · importando main-stable.js');await import('./src/main-stable.js?v=30');bootStage('main-stable.js cargado · simulación iniciada')}catch(e){showBootError(e?.stack||e?.message||String(e));console.error('Lúmina boot failure',e)}</script></body></html>
