name: NEXO AB105 G0 visibility probe compile-only

on:
  push:
    branches:
      - nexo-ab105-g0-visibility-probe
  workflow_dispatch:

jobs:
  compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Nexo
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone pinned Kafka source
        working-directory: /tmp
        run: |
          git clone --filter=blob:none https://github.com/apache/kafka.git /tmp/kafka
          cd /tmp/kafka
          git checkout 99b940733a9f6bc409457dba7108f08421d81e42
          test "$(git rev-parse HEAD)" = "99b940733a9f6bc409457dba7108f08421d81e42"

      - name: Install isolated visibility recorder
        working-directory: /tmp/kafka
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f"marker mismatch in {path}: {old[:160]!r}")
              p.write_text(s.replace(old, new, 1))

          # Recorder lives inside StandardAuthorizerData so both W1 and AUTH
          # use the same ThreadLocal without introducing a new module dependency.
          p = Path("metadata/src/main/java/org/apache/kafka/metadata/authorizer/StandardAuthorizerData.java")
          s = p.read_text()

          marker = "public class StandardAuthorizerData {"
          recorder = r'''
              private static final ThreadLocal<NexoVisibilityRecorder> NEXO_VISIBILITY_RECORDER =
                  new ThreadLocal<>();

              public static void nexoVisibilityInit() {
                  if (NEXO_VISIBILITY_RECORDER.get() == null) {
                      NEXO_VISIBILITY_RECORDER.set(new NexoVisibilityRecorder());
                  }
              }

              public static void nexoVisibilityFlush() {
                  NexoVisibilityRecorder recorder = NEXO_VISIBILITY_RECORDER.get();
                  if (recorder == null) return;
                  recorder.flush();
              }

              private static final class NexoVisibilityRecorder {
                  private static final int CAPACITY = 128;
                  private final long[] nano = new long[CAPACITY];
                  private final int[] kind = new int[CAPACITY];
                  private final Object[] cache = new Object[CAPACITY];
                  private final long[] correlation = new long[CAPACITY];
                  private int size;

                  void recordW1(AclCache snapshot) {
                      if (size >= CAPACITY) return;
                      int i = size++;
                      kind[i] = 1;
                      nano[i] = System.nanoTime();
                      cache[i] = snapshot;
                  }

                  void recordAuth(AclCache snapshot, long correlationId) {
                      if (size >= CAPACITY) return;
                      int i = size++;
                      kind[i] = 2;
                      nano[i] = System.nanoTime();
                      cache[i] = snapshot;
                      correlation[i] = correlationId;
                  }

                  void flush() {
                      Path path = Path.of(
                          "/tmp",
                          "nexo-ab105-visibility-" + Thread.currentThread().getId() + ".log");
                      try (BufferedWriter out = Files.newBufferedWriter(path)) {
                          out.write("thread=" + Thread.currentThread().getName());
                          out.newLine();
                          for (int i = 0; i < size; i++) {
                              out.write(
                                  kind[i] + " " + nano[i] + " "
                                      + System.identityHashCode(cache[i]) + " "
                                      + correlation[i]);
                              out.newLine();
                          }
                      } catch (IOException e) {
                          throw new RuntimeException("Nexo visibility probe flush failed", e);
                      }
                  }
              }
          '''
          imports = """import java.io.BufferedWriter;
          import java.io.IOException;
          import java.nio.file.Files;
          import java.nio.file.Path;
          """
          import_marker = "import java.util.ArrayList;"
          if "java.nio.file.Files" not in s:
              s = s.replace(import_marker, imports + import_marker, 1)
          if "NexoVisibilityRecorder" not in s:
              s = s.replace(marker, marker + recorder, 1)

          # W1: retain exactly the cache object produced by the existing removeAcl
          # operation, immediately after the existing plain assignment.
          w1 = "            aclCache = aclCacheSnapshot;"
          w1_new = w1 + "\n            nexoVisibilityInit();\n            NexoVisibilityRecorder recorder = NEXO_VISIBILITY_RECORDER.get();\n            recorder.recordW1(aclCacheSnapshot);"
          # Init here is deliberately after the existing assignment only as a fallback;
          # the workflow also initializes from the owner-thread publisher path below.
          if s.count(w1) != 1:
              raise SystemExit("W1 assignment marker mismatch")
          s = s.replace(w1, w1_new, 1)

          # AUTH: capture the exact cache object already obtained by the existing read.
          auth_marker = "            AclCache aclCacheSnapshot = aclCache;"
          auth_new = auth_marker + "\n            if (NEXO_VISIBILITY_RECORDER.get() != null && \\
                \"nexo-g0-ordering\".equals(requestContext.clientId()) && \\
                action.operation() == WRITE && \\
                action.resourcePattern().resourceType() == ResourceType.TOPIC && \\
                \"nexo-g0-ordering\".equals(action.resourcePattern().name())) {\n                NEXO_VISIBILITY_RECORDER.get().recordAuth(aclCacheSnapshot, requestContext.correlationId());\n            }"
          if s.count(auth_marker) != 1:
              raise SystemExit("AUTH cache-read marker mismatch")
          s = s.replace(auth_marker, auth_new, 1)

          p.write_text(s)

          # MetadataLoader: initialization happens on its publisher/event-queue owner
          # thread before publisher callbacks that can reach W1; flush happens in the
          # owner-thread shutdown event after publisher cleanup.
          p = Path("metadata/src/main/java/org/apache/kafka/image/loader/MetadataLoader.java")
          s = p.read_text()
          maybe_publish = "    private void maybePublishMetadata(MetadataDelta delta, MetadataImage image, LoaderManifest manifest) {"
          maybe_new = maybe_publish + "\n        org.apache.kafka.metadata.authorizer.StandardAuthorizerData.nexoVisibilityInit();"
          if s.count(maybe_publish) != 1:
              raise SystemExit("MetadataLoader maybePublishMetadata marker mismatch")
          s = s.replace(maybe_publish, maybe_new, 1)

          shutdown_end = """            for (Iterator<MetadataPublisher> iter = publishers.values().iterator();
                 iter.hasNext(); ) {
                closePublisher(iter.next());
                iter.remove();
            }
"""
          shutdown_new = shutdown_end + "            org.apache.kafka.metadata.authorizer.StandardAuthorizerData.nexoVisibilityFlush();\n"
          if s.count(shutdown_end) != 1:
              raise SystemExit("MetadataLoader shutdown marker mismatch")
          s = s.replace(shutdown_end, shutdown_new, 1)
          p.write_text(s)

          # Processor: initialize at owner-thread run entry and flush in the same
          # owner-thread finally block, before external thread.join returns.
          p = Path("core/src/main/scala/kafka/network/SocketServer.scala")
          s = p.read_text()
          processor_run = """  override def run(): Unit = {
    try {
"""
          processor_new = """  override def run(): Unit = {
    org.apache.kafka.metadata.authorizer.StandardAuthorizerData.nexoVisibilityInit()
    try {
"""
          if s.count(processor_run) < 1:
              raise SystemExit("Processor run marker not found")
          # Select the occurrence following the Processor class.
          class_pos = s.index("private[kafka] class Processor(")
          run_pos = s.index(processor_run, class_pos)
          s = s[:run_pos] + s[run_pos:].replace(processor_run, processor_new, 1)

          processor_finally = """    } finally {
      debug(s"Closing selector - processor $id")
      Utils.swallow(this.logger.underlying, Level.ERROR, () => closeAll())
    }
"""
          processor_finally_new = """    } finally {
      org.apache.kafka.metadata.authorizer.StandardAuthorizerData.nexoVisibilityFlush()
      debug(s"Closing selector - processor $id")
      Utils.swallow(this.logger.underlying, Level.ERROR, () => closeAll())
    }
"""
          if s.count(processor_finally) != 1:
              raise SystemExit("Processor finally marker mismatch")
          s = s.replace(processor_finally, processor_finally_new, 1)
          p.write_text(s)

          print("INJECTION_OK")
          PY

      - name: Compile metadata and core only
        working-directory: /tmp/kafka
        run: |
          set -o pipefail
          ./gradlew --no-daemon :metadata:compileJava :core:compileScala 2>&1 | tee /tmp/nexo-ab105-visibility-compile.log

      - name: Upload compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-ab105-g0-visibility-probe-compile
          path: /tmp/nexo-ab105-visibility-compile.log
