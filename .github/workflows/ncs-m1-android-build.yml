name: NCS M1 Android build

on:
  push:
    branches:
      - ncs-clean-architecture
    paths:
      - "NEXO_NCS/M1_ANDROID/**"
      - ".github/workflows/ncs-m1-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ncs-m1-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK, NDK and CMake
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
          yes | sdkmanager --licenses >/dev/null

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Fetch and verify pinned llama.cpp source
        working-directory: NEXO_NCS/M1_ANDROID
        run: |
          chmod +x prepare-llama-android.sh
          ./prepare-llama-android.sh
          test "$(git -C llama.cpp rev-parse HEAD)" = "10a60cf303566e10d6a7a2774c17d2085503d87b"

      - name: Assemble debug APK
        working-directory: NEXO_NCS/M1_ANDROID
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK and calculate digest
        id: apk
        working-directory: NEXO_NCS/M1_ANDROID
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.sha256
          echo "apk_path=NEXO_NCS/M1_ANDROID/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK and digest
        uses: actions/upload-artifact@v4
        with:
          name: nexo-m1-debug-${{ github.sha }}
          path: |
            NEXO_NCS/M1_ANDROID/app/build/outputs/apk/debug/app-debug.apk
            NEXO_NCS/M1_ANDROID/app-debug.sha256
          if-no-files-found: error
          retention-days: 14
