name: AB65 gate execution

on:
  push:
    branches: [main]
    paths:
      - "NEXO_CONTINUITY/AB61_SEMANTIC_REPAIR_INTERPRETER_2026-09-25.py"
      - "NEXO_CONTINUITY/AB62_GATE_RUNNER_2026-09-25.py"
      - "NEXO_CONTINUITY/AB63_GATE_RUNNER_IMPORT_SAFE_2026-09-25.py"
      - "NEXO_CONTINUITY/AB65_GATE_RUNNER_IMPORT_SAFE_V2_2026-09-25.py"
      - ".github/workflows/ab65-gate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute AB65 gate
        run: |
          python NEXO_CONTINUITY/AB65_GATE_RUNNER_IMPORT_SAFE_V2_2026-09-25.py > /tmp/ab65_gate_output.txt
          cat /tmp/ab65_gate_output.txt
      - name: Persist execution output
        run: |
          cp /tmp/ab65_gate_output.txt NEXO_CONTINUITY/AB65_GATE_OUTPUT_2026-09-25.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NEXO_CONTINUITY/AB65_GATE_OUTPUT_2026-09-25.txt
          git diff --cached --quiet && exit 0
          git commit -m "AB65: persist gate execution output"
          git push
