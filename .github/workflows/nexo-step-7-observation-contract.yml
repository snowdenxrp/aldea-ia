name: Nexo — M0 non-authority core contracts

on:
  workflow_dispatch:
  push:
    branches:
      - ncs-clean-architecture
    paths:
      - "src/nexo/core/observation.mjs"
      - "tests/nexo/observation.test.mjs"
      - "src/nexo/core/observation-equivalence.mjs"
      - "tests/nexo/observation-equivalence.test.mjs"
      - "src/nexo/core/ownership.mjs"
      - "tests/nexo/core-contracts.test.mjs"
      - "src/nexo/core/contracts.mjs"
      - "src/nexo/core/outcome-classifier.mjs"
      - "tests/nexo/outcome-classifier.test.mjs"
      - "src/nexo/core/protected-transition.mjs"
      - "tests/nexo/protected-transition.test.mjs"
      - "src/nexo/core/reconciliation.mjs"
      - "tests/nexo/reconciliation.test.mjs"
      - "src/nexo/orchestrator.js"
      - "tests/nexo/orchestrator.test.mjs"
      - "src/nexo/orchestrator.js"
      - "tests/nexo/orchestrator.test.mjs"
      - ".github/workflows/nexo-step-7-observation-contract.yml"
  pull_request:
    branches:
      - ncs-clean-architecture
    paths:
      - "src/nexo/core/observation.mjs"
      - "tests/nexo/observation.test.mjs"
      - "src/nexo/core/observation-equivalence.mjs"
      - "tests/nexo/observation-equivalence.test.mjs"
      - "src/nexo/core/ownership.mjs"
      - "tests/nexo/core-contracts.test.mjs"
      - "src/nexo/core/contracts.mjs"
      - "src/nexo/core/outcome-classifier.mjs"
      - "tests/nexo/outcome-classifier.test.mjs"
      - "src/nexo/core/protected-transition.mjs"
      - "tests/nexo/protected-transition.test.mjs"
      - "src/nexo/core/reconciliation.mjs"
      - "tests/nexo/reconciliation.test.mjs"
      - ".github/workflows/nexo-step-7-observation-contract.yml"

jobs:
  observation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/nexo/observation.test.mjs
      - run: node tests/nexo/observation-equivalence.test.mjs
      - run: node tests/nexo/outcome-classifier.test.mjs
      - run: node tests/nexo/core-contracts.test.mjs
      - run: node tests/nexo/protected-transition.test.mjs
      - run: node tests/nexo/reconciliation.test.mjs
      - name: Legacy simulation planner regression guard (non-authoritative)
        run: node tests/nexo/orchestrator.test.mjs
