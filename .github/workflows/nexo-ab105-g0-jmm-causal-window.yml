# Trigger probe: diagnostic semantics unchanged.
name: NEXO AB105 G0 JMM causal window discriminator

on:
  push:
    branches:
      - nexo-ab105-g0-jmm-causal-window
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  jmm-causal-window:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Nexo
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Clone pinned Kafka source
        run: |
          git clone --filter=blob:none https://github.com/apache/kafka.git /tmp/kafka
          cd /tmp/kafka
          git checkout 99b940733a9f6bc409457dba7108f08421d81e42
      - name: Install causal discriminator
        run: |
          mkdir -p /tmp/kafka/metadata/src/test/java/org/apache/kafka/metadata/authorizer
          cp docs/nexo/NEXO_AB105_G0_JMM_CAUSAL_WINDOW_TEST.java.txt /tmp/kafka/metadata/src/test/java/org/apache/kafka/metadata/authorizer/NexoJmmCausalWindowTest.java
      - name: Install temporary authorize snapshot probe
        working-directory: /tmp/kafka
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("metadata/src/main/java/org/apache/kafka/metadata/authorizer/StandardAuthorizerData.java")
          s = p.read_text()
          marker = "    private AclCache aclCache;\n"
          field = "    private final ThreadLocal<AclCache> nexoDiagnosticAuthorizeSnapshot = new ThreadLocal<>();\n"
          if s.count(marker) != 1:
              raise SystemExit("expected exactly one aclCache field marker")
          s = s.replace(marker, marker + field)
          old = "        AclCache aclCacheSnapshot = aclCache;\n"
          new = "        AclCache aclCacheSnapshot = aclCache;\n        nexoDiagnosticAuthorizeSnapshot.set(aclCacheSnapshot);\n"
          if s.count(old) != 1:
              raise SystemExit("expected exactly one findAclRule cache snapshot")
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Compile metadata test infrastructure
        working-directory: /tmp/kafka
        run: ./gradlew --no-daemon :metadata:compileTestJava
      - name: Execute causal JMM discriminator
        working-directory: /tmp/kafka
        run: ./gradlew --no-daemon :metadata:test --tests org.apache.kafka.metadata.authorizer.NexoJmmCausalWindowTest --info
      - name: Emit diagnostic evidence
        working-directory: /tmp/kafka
        run: |
          echo "KAFKA_REV=$(git rev-parse HEAD)" | tee /tmp/nexo-ab105-g0-jmm-causal-window-evidence.txt
          echo "CAUSAL_WINDOW=EXECUTED" | tee -a /tmp/nexo-ab105-g0-jmm-causal-window-evidence.txt
          echo "TIMING_ONLY_DIAGNOSTIC=TRUE" | tee -a /tmp/nexo-ab105-g0-jmm-causal-window-evidence.txt
          echo "AB105_116R=UNCHANGED" | tee -a /tmp/nexo-ab105-g0-jmm-causal-window-evidence.txt
          echo "AB105_117R=NOT_CREATED" | tee -a /tmp/nexo-ab105-g0-jmm-causal-window-evidence.txt
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: nexo-ab105-g0-jmm-causal-window-evidence
          path: /tmp/nexo-ab105-g0-jmm-causal-window-evidence.txt
