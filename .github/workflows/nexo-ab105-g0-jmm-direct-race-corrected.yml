name: NEXO AB105 G0 JMM direct race diagnostic corrected

on:
  push:
    branches:
      - nexo-ab105-g0-jmm-direct-race-corrected
  workflow_dispatch:

jobs:
  jmm-direct-race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Nexo
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Clone pinned Kafka source
        run: |
          git clone --filter=blob:none https://github.com/apache/kafka.git /tmp/kafka
          cd /tmp/kafka
          git checkout 99b940733a9f6bc409457dba7108f08421d81e42
      - name: Install corrected diagnostic
        run: |
          mkdir -p /tmp/kafka/metadata/src/test/java/org/apache/kafka/metadata/authorizer
          cp docs/nexo/NEXO_AB105_G0_JMM_DIRECT_RACE_TEST_CORRECTED.java.txt /tmp/kafka/metadata/src/test/java/org/apache/kafka/metadata/authorizer/NexoJmmDirectRaceTest.java
      - name: Compile metadata test infrastructure
        working-directory: /tmp/kafka
        run: ./gradlew --no-daemon :metadata:compileTestJava
      - name: Execute direct JMM race diagnostic
        working-directory: /tmp/kafka
        run: ./gradlew --no-daemon :metadata:test --tests org.apache.kafka.metadata.authorizer.NexoJmmDirectRaceTest --info
      - name: Emit diagnostic evidence
        working-directory: /tmp/kafka
        run: |
          echo "KAFKA_REV=$(git rev-parse HEAD)" | tee /tmp/nexo-ab105-g0-jmm-direct-race-evidence.txt
          echo "DIRECT_RACE=EXECUTED" | tee -a /tmp/nexo-ab105-g0-jmm-direct-race-evidence.txt
          echo "TIMING_ONLY_DIAGNOSTIC=TRUE" | tee -a /tmp/nexo-ab105-g0-jmm-direct-race-evidence.txt
          echo "AB105_116R=UNCHANGED" | tee -a /tmp/nexo-ab105-g0-jmm-direct-race-evidence.txt
          echo "AB105_117R=NOT_CREATED" | tee -a /tmp/nexo-ab105-g0-jmm-direct-race-evidence.txt
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: nexo-ab105-g0-jmm-direct-race-evidence
          path: /tmp/nexo-ab105-g0-jmm-direct-race-evidence.txt
