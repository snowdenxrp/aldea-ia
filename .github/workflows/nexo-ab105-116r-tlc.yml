name: Nexo AB105.116R TLC Gate
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/nexo/formal/AB105_116R_NexoFinite116.tla'
      - 'docs/nexo/formal/AB105_116R_NexoFinite116.cfg'
      - '.github/workflows/nexo-ab105-116r-tlc.yml'
jobs:
  tlc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download pinned TLA+ tools
        run: |
          curl -fL --retry 3 --retry-delay 2 'https://github.com/zactionsz/tla-tools/releases/download/tla2tools-2026.08.11.125311/tla2tools.jar' -o tla2tools.jar
          echo 'ab323b79802aedc3203b3f9af37c6aca3ed43f4e0225b36f2aa77b26de46c05f  tla2tools.jar' | sha256sum -c -
      - name: Run TLC finite model
        run: |
          set -o pipefail
          java -cp tla2tools.jar tlc2.TLC -workers auto docs/nexo/formal/AB105_116R_NexoFinite116 2>&1 | tee tlc.log
      - name: Upload TLC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-ab105-116r-tlc-evidence
          path: tlc.log
