name: NEXO AB105 G0 Kafka Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/nexo-ab105-g0-bootstrap.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  kafka-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Nexo
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone pinned Kafka source
        run: |
          git clone --filter=blob:none https://github.com/apache/kafka.git /tmp/kafka
          cd /tmp/kafka
          git checkout 99b940733a9f6bc409457dba7108f08421d81e42
          test "$(git rev-parse HEAD)" = "99b940733a9f6bc409457dba7108f08421d81e42"

      - name: Record JVM and Gradle
        working-directory: /tmp/kafka
        run: |
          java -version
          ./gradlew --version

      - name: Compile Kafka test infrastructure
        working-directory: /tmp/kafka
        run: |
          ./gradlew --no-daemon :test-common:test-common-runtime:compileJava :metadata:compileTestJava

      - name: Write temporary G0 harness compile probe
        working-directory: /tmp/kafka
        run: |
          mkdir -p server/src/test/java/org/apache/kafka/server
          cat > server/src/test/java/org/apache/kafka/server/NexoG0HarnessCompileProbe.java <<'EOF'
          package org.apache.kafka.server;

          import org.apache.kafka.clients.CommonClientConfigs;
          import org.apache.kafka.clients.admin.Admin;
          import org.apache.kafka.clients.admin.DeleteAclsOptions;
          import org.apache.kafka.clients.admin.NewTopic;
          import org.apache.kafka.clients.producer.KafkaProducer;
          import org.apache.kafka.clients.producer.Producer;
          import org.apache.kafka.clients.producer.ProducerRecord;
          import org.apache.kafka.common.Endpoint;
          import org.apache.kafka.common.TopicPartition;
          import org.apache.kafka.common.acl.AclBinding;
          import org.apache.kafka.common.acl.AclBindingFilter;
          import org.apache.kafka.common.acl.AclOperation;
          import org.apache.kafka.common.acl.AclPermissionType;
          import org.apache.kafka.common.resource.PatternType;
          import org.apache.kafka.common.resource.ResourcePattern;
          import org.apache.kafka.common.resource.ResourceType;
          import org.apache.kafka.common.serialization.ByteArraySerializer;
          import org.apache.kafka.common.test.KafkaClusterTestKit;
          import org.apache.kafka.common.test.TestKitNodes;
          import org.apache.kafka.metadata.authorizer.StandardAuthorizer;
          import org.apache.kafka.storage.internals.log.UnifiedLog;
          import kafka.server.BrokerServer;
          import org.apache.kafka.server.authorizer.AclCreateResult;
          import org.apache.kafka.server.authorizer.AclDeleteResult;
          import org.apache.kafka.server.authorizer.Action;
          import org.apache.kafka.server.authorizer.AuthorizationResult;
          import org.apache.kafka.server.authorizer.AuthorizableRequestContext;
          import org.apache.kafka.server.config.ServerConfigs;

          import java.io.IOException;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.concurrent.CompletableFuture;
          import java.util.concurrent.CompletionStage;
          import java.util.concurrent.CountDownLatch;
          import java.util.concurrent.atomic.AtomicReference;

          public final class NexoG0HarnessCompileProbe {
              private static final CountDownLatch A1_BARRIER = new CountDownLatch(1);
              private static final AtomicReference<List<AuthorizationResult>> A1_DELEGATED =
                  new AtomicReference<>();

              public static final class TargetAuthorizer extends StandardAuthorizer {
                  public TargetAuthorizer() { super(); }

                  @Override
                  public List<AuthorizationResult> authorize(
                          AuthorizableRequestContext requestContext,
                          List<Action> actions) {
                      List<AuthorizationResult> results = super.authorize(requestContext, actions);
                      A1_DELEGATED.set(results);
                      if (!results.isEmpty() && results.get(0) == AuthorizationResult.ALLOWED) {
                          awaitA1Barrier();
                      }
                      return results;
                  }

                  private static void awaitA1Barrier() {
                      try {
                          A1_BARRIER.await();
                      } catch (InterruptedException e) {
                          Thread.currentThread().interrupt();
                          throw new RuntimeException(e);
                      }
                  }
              }

              private static long exactEAccessor(BrokerServer broker, TopicPartition topicPartition) {
                  return broker.logManager().getLog(topicPartition, false)
                      .map(UnifiedLog::logEndOffset)
                      .orElse(-1L);
              }

              private static void apiSurface() throws Exception {
                  Map<Integer, Map<String, String>> perServer = new HashMap<>();
                  perServer.put(0, Map.of(
                      ServerConfigs.AUTHORIZER_CLASS_NAME_CONFIG,
                      TargetAuthorizer.class.getName()));

                  TestKitNodes nodes = new TestKitNodes.Builder()
                      .setNumBrokerNodes(1)
                      .setNumControllerNodes(1)
                      .setCombined(false)
                      .setPerServerProperties(perServer)
                      .build();

                  KafkaClusterTestKit cluster = new KafkaClusterTestKit.Builder(nodes)
                      .setConfigProp(ServerConfigs.AUTHORIZER_CLASS_NAME_CONFIG,
                          StandardAuthorizer.class.getName())
                      .build();

                  Admin admin = cluster.admin();
                  admin.createTopics(List.of(new NewTopic("nexo-g0", 1, (short) 1)));
                  admin.deleteAcls(List.of(AclBindingFilter.ANY), new DeleteAclsOptions());

                  Producer<byte[], byte[]> producer = new KafkaProducer<>(Map.of(
                      CommonClientConfigs.BOOTSTRAP_SERVERS_CONFIG, cluster.bootstrapServers(),
                      org.apache.kafka.clients.producer.ProducerConfig.KEY_SERIALIZER_CLASS_CONFIG,
                      ByteArraySerializer.class,
                      org.apache.kafka.clients.producer.ProducerConfig.VALUE_SERIALIZER_CLASS_CONFIG,
                      ByteArraySerializer.class));
                  producer.send(new ProducerRecord<>("nexo-g0", new byte[] {1})).get();

                  AclBinding writeAcl = new AclBinding(
                      new ResourcePattern(ResourceType.TOPIC, "nexo-g0", PatternType.LITERAL),
                      new org.apache.kafka.common.acl.AccessControlEntry(
                          "User:user1", "*", AclOperation.WRITE, AclPermissionType.ALLOW));

                  List<AclBinding> bindings = List.of(writeAcl);
                  List<AuthorizationResult> delegated = A1_DELEGATED.get();
                  CompletionStage<Void> marker = CompletableFuture.completedFuture(null);
                  Endpoint unusedEndpoint = null;
                  AclCreateResult unusedCreate = null;
                  AclDeleteResult unusedDelete = null;
                  IOException unusedIo = null;

                  producer.close();
                  admin.close();
                  cluster.close();
                  if (bindings.isEmpty() || delegated == null || marker == null ||
                      unusedEndpoint != null || unusedCreate != null || unusedDelete != null ||
                      unusedIo != null) {
                      throw new AssertionError("compile probe");
                  }
              }

              private NexoG0HarnessCompileProbe() {}
          }
          EOF

      - name: Compile temporary G0 harness probe
        working-directory: /tmp/kafka
        run: |
          ./gradlew --no-daemon :server:compileTestJava

      - name: Preserve compile-probe source
        run: |
          mkdir -p /tmp/nexo-g0-evidence
          cp /tmp/kafka/server/src/test/java/org/apache/kafka/server/NexoG0HarnessCompileProbe.java /tmp/nexo-g0-evidence/
          printf '%s\n' 'CURRENT_WORKFLOW_COMPILE_PROBE=EXECUTED' > /tmp/nexo-g0-evidence/status.txt
          printf '%s\n' 'G0_RUNTIME=NOT_EXECUTED' >> /tmp/nexo-g0-evidence/status.txt
          printf '%s\n' 'EXACT_RACE=UNKNOWN' >> /tmp/nexo-g0-evidence/status.txt

      - name: Emit bootstrap evidence
        working-directory: /tmp/kafka
        run: |
          {
            echo "KAFKA_REV=$(git rev-parse HEAD)"
            echo "JAVA_HOME=$JAVA_HOME"
            echo "JAVA_VERSION=$(java -version 2>&1 | head -n 1)"
            echo "BOOTSTRAP_COMPILE=SUCCESS"
            echo "G0_HARNESS_COMPILE=SUCCESS"
            echo "G0_RUNTIME=NOT_EXECUTED"
            echo "A1=NOT_EXECUTED"
            echo "D0=NOT_EXECUTED"
            echo "D1=NOT_EXECUTED"
            echo "D2=NOT_EXECUTED"
            echo "E=NOT_EXECUTED"
            echo "EXACT_RACE=UNKNOWN"
            echo "EXPLOITABILITY=UNKNOWN"
          } | tee /tmp/nexo-g0-evidence/bootstrap-evidence.txt

      - name: Upload bootstrap evidence
        uses: actions/upload-artifact@v4
        with:
          name: nexo-ab105-g0-bootstrap-evidence
          path: /tmp/nexo-g0-evidence/
          if-no-files-found: error

      - name: Execute Kafka G0 exact race witness
        working-directory: /tmp/kafka
        run: |
          mkdir -p server/src/test/java/org/apache/kafka/server /tmp/nexo-g0-evidence
          cat > server/src/test/java/org/apache/kafka/server/NexoG0ExactRaceTest.java <<'EOF'
          package org.apache.kafka.server;

          import kafka.server.BrokerServer;
          import org.apache.kafka.clients.CommonClientConfigs;
          import org.apache.kafka.clients.admin.Admin;
          import org.apache.kafka.clients.admin.DeleteAclsOptions;
          import org.apache.kafka.clients.admin.NewTopic;
          import org.apache.kafka.clients.producer.KafkaProducer;
          import org.apache.kafka.clients.producer.Producer;
          import org.apache.kafka.clients.producer.ProducerConfig;
          import org.apache.kafka.clients.producer.ProducerRecord;
          import org.apache.kafka.common.TopicPartition;
          import org.apache.kafka.common.acl.AccessControlEntry;
          import org.apache.kafka.common.acl.AclBinding;
          import org.apache.kafka.common.acl.AclBindingFilter;
          import org.apache.kafka.common.acl.AclOperation;
          import org.apache.kafka.common.acl.AclPermissionType;
          import org.apache.kafka.common.config.SaslConfigs;
          import org.apache.kafka.common.errors.TopicAuthorizationException;
          import org.apache.kafka.common.resource.PatternType;
          import org.apache.kafka.common.resource.ResourcePattern;
          import org.apache.kafka.common.resource.ResourceType;
          import org.apache.kafka.common.security.auth.SecurityProtocol;
          import org.apache.kafka.common.serialization.ByteArraySerializer;
          import org.apache.kafka.common.test.JaasUtils;
          import org.apache.kafka.common.test.KafkaClusterTestKit;
          import org.apache.kafka.common.test.TestKitNodes;
          import org.apache.kafka.common.test.TestUtils;
          import org.apache.kafka.metadata.authorizer.StandardAuthorizer;
          import org.apache.kafka.server.authorizer.Action;
          import org.apache.kafka.server.authorizer.AuthorizationResult;
          import org.apache.kafka.server.authorizer.AuthorizableRequestContext;
          import org.apache.kafka.storage.internals.log.UnifiedLog;
          import org.junit.jupiter.api.Assertions;
          import org.junit.jupiter.api.Test;

          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.concurrent.CountDownLatch;
          import java.util.concurrent.TimeUnit;
          import java.util.concurrent.atomic.AtomicBoolean;
          import java.util.concurrent.atomic.AtomicLong;
          import java.util.concurrent.atomic.AtomicReference;

          public class NexoG0ExactRaceTest {
              private static final String TOPIC = "nexo-g0-exact-race";
              private static final String USER = "plain-user1";
              private static final String USER_PRINCIPAL = "User:" + USER;
              private static final CountDownLatch A1_RELEASE = new CountDownLatch(1);
              private static final AtomicBoolean A1_HELD = new AtomicBoolean(false);
              private static final AtomicReference<String> A1_CONTEXT = new AtomicReference<>("UNKNOWN");
              private static final AtomicLong A1_ALLOWED_ACTIONS = new AtomicLong(0);

              public static final class TargetAuthorizer extends StandardAuthorizer {
                  @Override
                  public List<AuthorizationResult> authorize(
                          AuthorizableRequestContext requestContext,
                          List<Action> actions) {
                      List<AuthorizationResult> results = super.authorize(requestContext, actions);
                      for (int i = 0; i < actions.size(); i++) {
                          Action action = actions.get(i);
                          if (action.operation() == AclOperation.WRITE
                              && action.resourcePattern().resourceType() == ResourceType.TOPIC
                              && TOPIC.equals(action.resourcePattern().name())
                              && results.get(i) == AuthorizationResult.ALLOWED
                              && USER_PRINCIPAL.equals(requestContext.principal().toString())
                              && A1_HELD.compareAndSet(false, true)) {
                              A1_ALLOWED_ACTIONS.set(actions.size());
                              A1_CONTEXT.set(requestContext.requestType().toString());
                              try {
                                  if (!A1_RELEASE.await(30, TimeUnit.SECONDS)) {
                                      throw new AssertionError("A1 release timeout");
                                  }
                              } catch (InterruptedException e) {
                                  Thread.currentThread().interrupt();
                                  throw new AssertionError("A1 interrupted", e);
                              }
                          }
                      }
                      return results;
                  }
              }

              private static Map<String, Object> userProducerConfig(String bootstrapServers) {
                  Map<String, Object> props = new HashMap<>();
                  props.put(CommonClientConfigs.BOOTSTRAP_SERVERS_CONFIG, bootstrapServers);
                  props.put(CommonClientConfigs.SECURITY_PROTOCOL_CONFIG, SecurityProtocol.SASL_PLAINTEXT.name);
                  props.put(SaslConfigs.SASL_MECHANISM, "PLAIN");
                  props.put(SaslConfigs.SASL_JAAS_CONFIG,
                      String.format(
                          "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"%s\" password=\"%s\";",
                          JaasUtils.KAFKA_PLAIN_USER1, JaasUtils.KAFKA_PLAIN_USER1_PASSWORD));
                  props.put(ProducerConfig.KEY_SERIALIZER_CLASS_CONFIG, ByteArraySerializer.class.getName());
                  props.put(ProducerConfig.VALUE_SERIALIZER_CLASS_CONFIG, ByteArraySerializer.class.getName());
                  props.put(ProducerConfig.ACKS_CONFIG, "all");
                  return props;
              }

              private static long localE(BrokerServer broker, TopicPartition tp) {
                  return broker.logManager().getLog(tp, false).map(UnifiedLog::logEndOffset).orElse(-1L);
              }

              private static AclBinding acl(String principal, AclOperation operation) {
                  return new AclBinding(
                      new ResourcePattern(ResourceType.TOPIC, TOPIC, PatternType.LITERAL),
                      new AccessControlEntry(principal, "*", operation, AclPermissionType.ALLOW));
              }

              @Test
              public void exactRace() throws Exception {
                  Path evidence = Path.of("/tmp/nexo-g0-evidence/g0-exact-race-evidence.txt");
                  Files.writeString(evidence,
                      "PROTOCOL=A1->D0->D1->RELEASE->D2->E\n" +
                      "KAFKA_REV=99b940733a9f6bc409457dba7108f08421d81e42\n" +
                      "G0_RUNTIME=STARTED\n", StandardCharsets.UTF_8);

                  Map<Integer, Map<String, String>> perServer = new HashMap<>();
                  perServer.put(0, Map.of(
                      "authorizer.class.name", TargetAuthorizer.class.getName()));

                  TestKitNodes nodes = new TestKitNodes.Builder()
                      .setNumBrokerNodes(1)
                      .setNumControllerNodes(1)
                      .setBrokerSecurityProtocol(SecurityProtocol.SASL_PLAINTEXT)
                      .setControllerSecurityProtocol(SecurityProtocol.SASL_PLAINTEXT)
                      .setPerServerProperties(perServer)
                      .build();

                  try (KafkaClusterTestKit cluster = new KafkaClusterTestKit.Builder(nodes).build();
                       Admin admin = cluster.admin()) {
                      cluster.format();
                      cluster.startup();
                      cluster.waitForReadyBrokers();

                      admin.createTopics(List.of(new NewTopic(TOPIC, 1, (short) 1))).all().get();
                      cluster.waitTopicCreation(TOPIC, 1);

                      TopicPartition tp = new TopicPartition(TOPIC, 0);
                      BrokerServer broker = cluster.brokers().get(0);
                      TestUtils.waitForCondition(
                          () -> broker.logManager().getLog(tp, false).isPresent(),
                          10_000,
                          "target broker local log did not appear");

                      admin.createAcls(List.of(
                          acl(USER_PRINCIPAL, AclOperation.WRITE),
                          acl(USER_PRINCIPAL, AclOperation.DESCRIBE)
                      )).all().get();

                      try (Producer<byte[], byte[]> producer =
                               new KafkaProducer<>(userProducerConfig(cluster.bootstrapServers()))) {
                          long e0 = localE(broker, tp);
                          Assertions.assertEquals(0L, e0, "E0 must be zero before the isolated produce");

                          var original = producer.send(new ProducerRecord<>(TOPIC, new byte[] {1}));
                          TestUtils.waitForCondition(
                              A1_HELD::get,
                              10_000,
                              "A1 was not observed and held");

                          admin.deleteAcls(
                              List.of(new AclBindingFilter(
                                  new org.apache.kafka.common.resource.ResourcePatternFilter(
                                      ResourceType.TOPIC, TOPIC, PatternType.LITERAL),
                                  new org.apache.kafka.common.acl.AccessControlEntryFilter(
                                      USER_PRINCIPAL, "*", AclOperation.WRITE, AclPermissionType.ANY))),
                              new DeleteAclsOptions()).all().get();

                          Files.writeString(evidence,
                              Files.readString(evidence) +
                              "A1=OBSERVED_HELD\n" +
                              "A1_ALLOWED_ACTIONS=" + A1_ALLOWED_ACTIONS.get() + "\n" +
                              "A1_REQUEST_TYPE=" + A1_CONTEXT.get() + "\n" +
                              "D0=DELETE_ACLS_COMPLETED\n", StandardCharsets.UTF_8);

                          boolean d1Denied = false;
                          try (Producer<byte[], byte[]> freshProducer =
                                   new KafkaProducer<>(userProducerConfig(cluster.bootstrapServers()))) {
                              try {
                                  freshProducer.send(new ProducerRecord<>(TOPIC, new byte[] {2})).get(10, TimeUnit.SECONDS);
                              } catch (java.util.concurrent.ExecutionException ex) {
                                  d1Denied = ex.getCause() instanceof TopicAuthorizationException;
                              }
                          }
                          Assertions.assertTrue(d1Denied, "D1 must observe TopicAuthorizationException after D0");

                          Files.writeString(evidence,
                              Files.readString(evidence) +
                              "D1=OBSERVED_DENIED_TOPIC_AUTHORIZATION\n", StandardCharsets.UTF_8);

                          A1_RELEASE.countDown();
                          original.get(15, TimeUnit.SECONDS);

                          long e1 = localE(broker, tp);
                          Files.writeString(evidence,
                              Files.readString(evidence) +
                              "RELEASE=ISSUED\n" +
                              "D2=ORIGINAL_PRODUCE_COMPLETED\n" +
                              "E0=" + e0 + "\n" +
                              "E1=" + e1 + "\n" +
                              "E_DELTA=" + (e1 - e0) + "\n", StandardCharsets.UTF_8);

                          Assertions.assertEquals(e0 + 1, e1, "E1 must equal E0 + 1");
                          Files.writeString(evidence,
                              Files.readString(evidence) +
                              "G0_RUNTIME=PASS\n" +
                              "EXACT_RACE=OBSERVED\n" +
                              "EXPLOITABILITY=NOT_INFERRED\n", StandardCharsets.UTF_8);
                      }
                  }
              }
          }
          EOF
          ./gradlew --no-daemon :server:test --tests org.apache.kafka.server.NexoG0ExactRaceTest -x checkstyleTest -x spotbugsMain --info

      - name: Collect G0 exact race evidence
        if: always()
        run: |
          mkdir -p /tmp/nexo-g0-evidence
          test -f /tmp/nexo-g0-evidence/g0-exact-race-evidence.txt || printf '%s\n' \
            'G0_RUNTIME=FAILED_OR_NO_RECOVERABLE_WITNESS' \
            'EXACT_RACE=UNKNOWN' \
            > /tmp/nexo-g0-evidence/g0-exact-race-evidence.txt
          printf '%s\n' 'KAFKA_REV=99b940733a9f6bc409457dba7108f08421d81e42' \
            > /tmp/nexo-g0-evidence/run-status.txt

      - name: Upload G0 exact race evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-ab105-g0-exact-race-evidence
          path: /tmp/nexo-g0-evidence/
          if-no-files-found: error
