name: NEXO AB105 G0 Kafka Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/nexo-ab105-g0-bootstrap.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  kafka-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Nexo
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone pinned Kafka source
        run: |
          git clone --filter=blob:none https://github.com/apache/kafka.git /tmp/kafka
          cd /tmp/kafka
          git checkout 99b940733a9f6bc409457dba7108f08421d81e42
          test "$(git rev-parse HEAD)" = "99b940733a9f6bc409457dba7108f08421d81e42"

      - name: Record JVM and Gradle
        working-directory: /tmp/kafka
        run: |
          java -version
          ./gradlew --version

      - name: Compile Kafka test infrastructure
        working-directory: /tmp/kafka
        run: |
          ./gradlew --no-daemon :test-common:test-common-runtime:compileJava :metadata:compileTestJava

      - name: Write temporary G0 harness compile probe
        working-directory: /tmp/kafka
        run: |
          mkdir -p server/src/test/java/org/apache/kafka/server
          cat > server/src/test/java/org/apache/kafka/server/NexoG0HarnessCompileProbe.java <<'EOF'
          package org.apache.kafka.server;

          import org.apache.kafka.clients.CommonClientConfigs;
          import org.apache.kafka.clients.admin.Admin;
          import org.apache.kafka.clients.admin.DeleteAclsOptions;
          import org.apache.kafka.clients.admin.NewTopic;
          import org.apache.kafka.clients.producer.KafkaProducer;
          import org.apache.kafka.clients.producer.Producer;
          import org.apache.kafka.clients.producer.ProducerRecord;
          import org.apache.kafka.common.Endpoint;
          import org.apache.kafka.common.TopicPartition;
          import org.apache.kafka.common.acl.AclBinding;
          import org.apache.kafka.common.acl.AclBindingFilter;
          import org.apache.kafka.common.acl.AclOperation;
          import org.apache.kafka.common.acl.AclPermissionType;
          import org.apache.kafka.common.resource.PatternType;
          import org.apache.kafka.common.resource.ResourcePattern;
          import org.apache.kafka.common.resource.ResourceType;
          import org.apache.kafka.common.serialization.ByteArraySerializer;
          import org.apache.kafka.common.test.KafkaClusterTestKit;
          import org.apache.kafka.common.test.TestKitNodes;
          import org.apache.kafka.metadata.authorizer.StandardAuthorizer;
          import org.apache.kafka.storage.internals.log.UnifiedLog;
          import kafka.server.BrokerServer;
          import org.apache.kafka.server.authorizer.AclCreateResult;
          import org.apache.kafka.server.authorizer.AclDeleteResult;
          import org.apache.kafka.server.authorizer.Action;
          import org.apache.kafka.server.authorizer.AuthorizationResult;
          import org.apache.kafka.server.authorizer.AuthorizableRequestContext;
          import org.apache.kafka.server.config.ServerConfigs;

          import java.io.IOException;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.concurrent.CompletableFuture;
          import java.util.concurrent.CompletionStage;
          import java.util.concurrent.CountDownLatch;
          import java.util.concurrent.atomic.AtomicReference;

          /**
           * Compile-only probe for the frozen AB105 G0 harness.
           *
           * This class is deliberately not a JUnit test and is never executed by this gate.
           * It verifies that the planned KafkaClusterTestKit + target Authorizer wrapper +
           * Admin DeleteAcls + Producer + UnifiedLog witness API surface is compilable at the
           * pinned Kafka revision.
           */
          public final class NexoG0HarnessCompileProbe {
              private static final CountDownLatch A1_BARRIER = new CountDownLatch(1);
              private static final AtomicReference<List<AuthorizationResult>> A1_DELEGATED =
                  new AtomicReference<>();

              public static final class TargetAuthorizer extends StandardAuthorizer {
                  public TargetAuthorizer() {
                      super();
                  }

                  @Override
                  public List<AuthorizationResult> authorize(
                          AuthorizableRequestContext requestContext,
                          List<Action> actions) {
                      List<AuthorizationResult> results = super.authorize(requestContext, actions);
                      A1_DELEGATED.set(results);
                      if (!results.isEmpty() && results.get(0) == AuthorizationResult.ALLOWED) {
                          // Runtime harness will release this only after D1.
                          awaitA1Barrier();
                      }
                      return results;
                  }

                  private static void awaitA1Barrier() {
                      try {
                          A1_BARRIER.await();
                      } catch (InterruptedException e) {
                          Thread.currentThread().interrupt();
                          throw new RuntimeException(e);
                      }
                  }
              }

              // Exact compile-time E witness accessor used by the frozen G0 contract.
              // This method is never invoked by the compile-only gate.
              private static long exactEAccessor(BrokerServer broker, TopicPartition topicPartition) {
                  return broker.logManager().getLog(topicPartition, false)
                      .map(UnifiedLog::logEndOffset)
                      .orElse(-1L);
              }

              private static void apiSurface() throws Exception {
                  Map<Integer, Map<String, String>> perServer = new HashMap<>();
                  perServer.put(0, Map.of(
                      ServerConfigs.AUTHORIZER_CLASS_NAME_CONFIG,
                      TargetAuthorizer.class.getName()));

                  TestKitNodes nodes = new TestKitNodes.Builder()
                      .setNumBrokerNodes(1)
                      .setNumControllerNodes(1)
                      .setCombined(false)
                      .setPerServerProperties(perServer)
                      .build();

                  KafkaClusterTestKit cluster = new KafkaClusterTestKit.Builder(nodes)
                      .setConfigProp(ServerConfigs.AUTHORIZER_CLASS_NAME_CONFIG,
                          StandardAuthorizer.class.getName())
                      .build();

                  Admin admin = cluster.admin();
                  admin.createTopics(List.of(new NewTopic("nexo-g0", 1, (short) 1)));
                  admin.deleteAcls(List.of(AclBindingFilter.ANY), new DeleteAclsOptions());

                  Producer<byte[], byte[]> producer = new KafkaProducer<>(Map.of(
                      CommonClientConfigs.BOOTSTRAP_SERVERS_CONFIG, cluster.bootstrapServers(),
                      org.apache.kafka.clients.producer.ProducerConfig.KEY_SERIALIZER_CLASS_CONFIG,
                      ByteArraySerializer.class,
                      org.apache.kafka.clients.producer.ProducerConfig.VALUE_SERIALIZER_CLASS_CONFIG,
                      ByteArraySerializer.class));
                  producer.send(new ProducerRecord<>("nexo-g0", new byte[] {1})).get();

                  AclBinding writeAcl = new AclBinding(
                      new ResourcePattern(ResourceType.TOPIC, "nexo-g0", PatternType.LITERAL),
                      new org.apache.kafka.common.acl.AccessControlEntry(
                          "User:user1", "*", AclOperation.WRITE, AclPermissionType.ALLOW));

                  List<AclBinding> bindings = List.of(writeAcl);
                  List<AuthorizationResult> delegated = A1_DELEGATED.get();
                  CompletionStage<Void> marker = CompletableFuture.completedFuture(null);
                  Endpoint unusedEndpoint = null;
                  AclCreateResult unusedCreate = null;
                  AclDeleteResult unusedDelete = null;
                  IOException unusedIo = null;

                  producer.close();
                  admin.close();
                  cluster.close();
                  if (bindings.isEmpty() || delegated == null || marker == null ||
                      unusedEndpoint != null || unusedCreate != null || unusedDelete != null ||
                      unusedIo != null) {
                      throw new AssertionError("compile probe");
                  }
              }

              private NexoG0HarnessCompileProbe() {}
          }
          EOF

      - name: Compile temporary G0 harness probe
        working-directory: /tmp/kafka
        run: |
          ./gradlew --no-daemon :server:compileTestJava

      - name: Emit bootstrap evidence
        working-directory: /tmp/kafka
        run: |
          {
            echo "KAFKA_REV=$(git rev-parse HEAD)"
            echo "JAVA_HOME=$JAVA_HOME"
            echo "JAVA_VERSION=$(java -version 2>&1 | head -n 1)"
            echo "BOOTSTRAP_COMPILE=SUCCESS"
            echo "G0_HARNESS_COMPILE=SUCCESS"
            echo "G0_RUNTIME=NOT_EXECUTED"
            echo "A1=NOT_EXECUTED"
            echo "D0=NOT_EXECUTED"
            echo "D1=NOT_EXECUTED"
            echo "D2=NOT_EXECUTED"
            echo "E=NOT_EXECUTED"
            echo "EXACT_RACE=UNKNOWN"
            echo "EXPLOITABILITY=UNKNOWN"
          } | tee /tmp/nexo-g0-bootstrap-evidence.txt

      - name: Upload bootstrap evidence
        uses: actions/upload-artifact@v4
        with:
          name: nexo-ab105-g0-bootstrap-evidence
          path: /tmp/nexo-g0-bootstrap-evidence.txt
