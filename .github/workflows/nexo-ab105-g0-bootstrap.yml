name: NEXO AB105 G0 Kafka Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/nexo-ab105-g0-bootstrap.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  kafka-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Nexo
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone pinned Kafka source
        run: |
          git clone --filter=blob:none https://github.com/apache/kafka.git /tmp/kafka
          cd /tmp/kafka
          git checkout 99b940733a9f6bc409457dba7108f08421d81e42
          test "$(git rev-parse HEAD)" = "99b940733a9f6bc409457dba7108f08421d81e42"

      - name: Record JVM and Gradle
        working-directory: /tmp/kafka
        run: |
          java -version
          ./gradlew --version

      - name: Compile Kafka test infrastructure
        working-directory: /tmp/kafka
        run: |
          ./gradlew --no-daemon :test-common:test-common-runtime:compileJava :metadata:compileTestJava

      - name: Write temporary G0 runtime harness
        working-directory: /tmp/kafka
        run: |
          mkdir -p server/src/test/java/org/apache/kafka/server
          cat > server/src/test/java/org/apache/kafka/server/NexoG0RuntimeTest.java <<'EOF'
          package org.apache.kafka.server;

          import org.apache.kafka.clients.admin.Admin;
          import org.apache.kafka.clients.admin.DeleteAclsOptions;
          import org.apache.kafka.clients.admin.NewTopic;
          import org.apache.kafka.clients.producer.KafkaProducer;
          import org.apache.kafka.clients.producer.Producer;
          import org.apache.kafka.clients.producer.ProducerConfig;
          import org.apache.kafka.clients.producer.ProducerRecord;
          import org.apache.kafka.common.acl.AclBinding;
          import org.apache.kafka.common.acl.AclBindingFilter;
          import org.apache.kafka.common.acl.AccessControlEntry;
          import org.apache.kafka.common.acl.AclOperation;
          import org.apache.kafka.common.acl.AclPermissionType;
          import org.apache.kafka.common.config.SaslConfigs;
          import org.apache.kafka.common.network.ListenerName;
          import org.apache.kafka.common.security.auth.KafkaPrincipal;
          import org.apache.kafka.common.security.auth.SecurityProtocol;
          import org.apache.kafka.common.TopicPartition;
          import org.apache.kafka.common.resource.PatternType;
          import org.apache.kafka.common.resource.ResourcePattern;
          import org.apache.kafka.common.resource.ResourceType;
          import org.apache.kafka.common.serialization.ByteArraySerializer;
          import org.apache.kafka.common.test.KafkaClusterTestKit;
          import org.apache.kafka.common.test.TestKitNodes;
          import org.apache.kafka.metadata.authorizer.StandardAuthorizer;
          import org.apache.kafka.common.errors.TopicAuthorizationException;
          import org.apache.kafka.server.authorizer.Action;
          import org.apache.kafka.server.authorizer.AuthorizableRequestContext;
          import org.apache.kafka.server.authorizer.AuthorizationResult;
          import org.apache.kafka.storage.internals.log.UnifiedLog;
          import kafka.server.BrokerServer;
          import org.apache.kafka.server.config.ServerConfigs;
          import org.junit.jupiter.api.Assertions;
          import org.junit.jupiter.api.Test;

          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.concurrent.CountDownLatch;
          import java.util.concurrent.Future;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.TimeUnit;

          import static org.apache.kafka.common.acl.AclOperation.WRITE;
          import static org.apache.kafka.common.acl.AclPermissionType.ALLOW;
          import static org.apache.kafka.common.resource.PatternType.LITERAL;
          
          public final class NexoG0RuntimeTest {
              private static final String TOPIC_NAME = "nexo-g0-runtime";
              private static final String USER = "plain-user1";
              private static final String PASSWORD = "plain-user1-secret";
              private static final CountDownLatch A1_OBSERVED = new CountDownLatch(1);
              private static final CountDownLatch A1_RELEASE = new CountDownLatch(1);
    
              public static final class TargetAuthorizer extends StandardAuthorizer {
                  @Override
                  public List<AuthorizationResult> authorize(
                          AuthorizableRequestContext requestContext,
                          List<Action> actions) {
                      List<AuthorizationResult> results = super.authorize(requestContext, actions);
                      if (requestContext.principal().getName().equals(USER)
                              && actions.size() == 1
                              && actions.get(0).operation() == WRITE
                              && actions.get(0).resourcePattern().resourceType() == org.apache.kafka.common.resource.ResourceType.TOPIC
                              && TOPIC_NAME.equals(actions.get(0).resourcePattern().name())
                              && !results.isEmpty()
                              && results.get(0) == AuthorizationResult.ALLOWED) {
                          A1_OBSERVED.countDown();
                          try {
                              if (!A1_RELEASE.await(60, TimeUnit.SECONDS)) {
                                  throw new AssertionError("A1 release timeout");
                              }
                          } catch (InterruptedException e) {
                              Thread.currentThread().interrupt();
                              throw new AssertionError(e);
                          }
                      }
                      return results;
                  }
              }

              private static Map<String, Object> userClient() {
                  return Map.of(
                      "security.protocol", SecurityProtocol.SASL_PLAINTEXT.name,
                      SaslConfigs.SASL_MECHANISM, "PLAIN",
                      SaslConfigs.SASL_JAAS_CONFIG,
                      "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"" + USER
                          + "\" password=\"" + PASSWORD + "\";"
                  );
              }

              private static AclBinding userWriteAcl() {
                  return new AclBinding(
                      new ResourcePattern(ResourceType.TOPIC, TOPIC_NAME, LITERAL),
                      new AccessControlEntry("User:" + USER, "*", WRITE, ALLOW));
              }

              private static long exactE(BrokerServer broker) {
                  return broker.logManager()
                      .getLog(new TopicPartition(TOPIC_NAME, 0), false)
                      .map(UnifiedLog::logEndOffset)
                      .orElse(-1L);
              }


              @Test
              public void frozenA1D0D1D2E() throws Exception {
                  Map<Integer, Map<String, String>> perServer = new HashMap<>();
                  perServer.put(0, Map.of(
                      ServerConfigs.AUTHORIZER_CLASS_NAME_CONFIG,
                      TargetAuthorizer.class.getName()));

                  TestKitNodes nodes = new TestKitNodes.Builder()
                      .setNumBrokerNodes(1)
                      .setNumControllerNodes(1)
                      .setCombined(false)
                      .setBrokerSecurityProtocol(SecurityProtocol.SASL_PLAINTEXT)
                      .setControllerSecurityProtocol(SecurityProtocol.SASL_PLAINTEXT)
                      .setPerServerProperties(perServer)
                      .build();

                  try (KafkaClusterTestKit cluster = new KafkaClusterTestKit.Builder(nodes)
                      .setConfigProp(ServerConfigs.AUTHORIZER_CLASS_NAME_CONFIG, StandardAuthorizer.class.getName())
                      .build()) {
                      cluster.format();
                      cluster.startup();
                      cluster.waitForReadyBrokers();
                      BrokerServer broker = cluster.brokers().get(0);

                      try (Admin admin = cluster.admin()) {
                          admin.createTopics(List.of(new NewTopic(TOPIC_NAME, 1, (short) 1))).all().get();
                          admin.createAcls(List.of(userWriteAcl())).all().get();
                      }

                      final long baseline = exactE(broker);
                      Assertions.assertEquals(0L, baseline, "baseline E must be zero");

                      ExecutorService executor = Executors.newSingleThreadExecutor();
                      Future<?> d2 = null;
                      try {
                          try (Producer<byte[], byte[]> producer = new KafkaProducer<>(new java.util.HashMap<>(Map.of(
                              ProducerConfig.BOOTSTRAP_SERVERS_CONFIG, cluster.bootstrapServers(),
                              ProducerConfig.KEY_SERIALIZER_CLASS_CONFIG, ByteArraySerializer.class.getName(),
                              ProducerConfig.VALUE_SERIALIZER_CLASS_CONFIG, ByteArraySerializer.class.getName(),
                              ProducerConfig.ACKS_CONFIG, "all"
                          )) {{ putAll(userClient()); }})) {
                              d2 = executor.submit(() -> {
                                  try {
                                      producer.send(new ProducerRecord<>(TOPIC_NAME, new byte[] {1})).get();
                                  } catch (Exception e) {
                                      throw new RuntimeException(e);
                                  }
                              });

                              Assertions.assertTrue(A1_OBSERVED.await(30, TimeUnit.SECONDS), "A1 not observed");

                              try (Admin admin = cluster.admin()) {
                                  admin.deleteAcls(
                                      List.of(new AclBindingFilter(
                                          new ResourcePattern(ResourceType.TOPIC, TOPIC_NAME, LITERAL).toFilter(),
                                          org.apache.kafka.common.acl.AccessControlEntryFilter.ANY)),
                                      new DeleteAclsOptions()).all().get();
                              }

                              try (Producer<byte[], byte[]> d1Producer = new KafkaProducer<>(new java.util.HashMap<>(Map.of(
                                  ProducerConfig.BOOTSTRAP_SERVERS_CONFIG, cluster.bootstrapServers(),
                                  ProducerConfig.KEY_SERIALIZER_CLASS_CONFIG, ByteArraySerializer.class.getName(),
                                  ProducerConfig.VALUE_SERIALIZER_CLASS_CONFIG, ByteArraySerializer.class.getName(),
                                  ProducerConfig.ACKS_CONFIG, "all"
                              )) {{ putAll(userClient()); }})) {
                                  java.util.concurrent.ExecutionException d1ExecutionException = Assertions.assertThrows(
                                      java.util.concurrent.ExecutionException.class,
                                      () -> d1Producer.send(new ProducerRecord<>(TOPIC_NAME, 0, null, new byte[] {2})).get());
                                  Assertions.assertInstanceOf(
                                      TopicAuthorizationException.class,
                                      d1ExecutionException.getCause(),
                                      "D1 must fail with TopicAuthorizationException");
                                  TopicAuthorizationException d1Exception =
                                      (TopicAuthorizationException) d1ExecutionException.getCause();
                                  Assertions.assertTrue(
                                      d1Exception.unauthorizedTopics().contains(TOPIC_NAME),
                                      "D1 must deny the target topic");
                              }

                              A1_RELEASE.countDown();
                              d2.get(30, TimeUnit.SECONDS);
                              long after = exactE(broker);
                              String witness = "G0_WITNESS A1=OBSERVED D0=OBSERVED D1=DENIED D2=SUCCESS E_BASELINE="
                                  + baseline + " E_AFTER=" + after;
                              java.nio.file.Files.writeString(
                                  java.nio.file.Path.of("/tmp/nexo-g0-witness.txt"), witness + System.lineSeparator());
                              System.out.println(witness);
                              Assertions.assertEquals(1L, after, "E must show exactly one append");
                          }
                      } finally {
                          A1_RELEASE.countDown();
                          executor.shutdownNow();
                      }
                  }
              }
          }
          EOF

      - name: Compile and execute real G0 runtime harness
        working-directory: /tmp/kafka
        run: |
          ./gradlew --no-daemon :server:compileTestJava
          ./gradlew --no-daemon :server:test --tests org.apache.kafka.server.NexoG0RuntimeTest --info -x :server:checkstyleTest

      - name: Emit bootstrap evidence
        working-directory: /tmp/kafka
        run: |
          {
            echo "KAFKA_REV=$(git rev-parse HEAD)"
            echo "JAVA_HOME=$JAVA_HOME"
            echo "JAVA_VERSION=$(java -version 2>&1 | head -n 1)"
            echo "BOOTSTRAP_COMPILE=SUCCESS"
            echo "G0_HARNESS_COMPILE=SUCCESS"
            if test -f /tmp/nexo-g0-witness.txt; then
              echo "G0_RUNTIME=OBSERVED_SUCCESS"
              cat /tmp/nexo-g0-witness.txt
              echo "EXACT_RACE=OBSERVED_WITNESS"
              echo "EXPLOITABILITY=UNKNOWN_PENDING_SEPARATE_ANALYSIS"
            else
              echo "G0_RUNTIME=NO_WITNESS"
              echo "A1=UNKNOWN"
              echo "D0=UNKNOWN"
              echo "D1=UNKNOWN"
              echo "D2=UNKNOWN"
              echo "E=UNKNOWN"
              echo "EXACT_RACE=UNKNOWN"
              echo "EXPLOITABILITY=UNKNOWN"
            fi
          } | tee /tmp/nexo-g0-bootstrap-evidence.txt

      - name: Upload bootstrap evidence
        uses: actions/upload-artifact@v4
        with:
          name: nexo-ab105-g0-bootstrap-evidence
          path: /tmp/nexo-g0-bootstrap-evidence.txt

      # AB105 controlled main-branch execution gate: real G0 runtime harness. No Nexo model implementation.
      # CI trigger touch: rerun observation after corrected API gate.
