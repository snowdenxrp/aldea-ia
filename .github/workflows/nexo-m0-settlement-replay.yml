name: Nexo M0 — effect and settlement contract regressions

on:
  push:
    branches:
      - ncs-clean-architecture
    paths:
      - "src/nexo/effect-adapter.js"
      - "src/nexo/core/continuity-owner.mjs"
      - "src/nexo/runtime.js"
      - "scripts/nexo-repair-settlement.mjs"
      - "tests/nexo/effect-adapter.test.mjs"
      - "tests/nexo/repair-settlement-crash-cuts.test.mjs"
      - ".github/workflows/nexo-m0-settlement-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexo-m0-effect-settlement-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m0-contract-regressions:
    name: M0 effect adapter and settlement crash cuts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Effect adapter contract regressions
        run: node tests/nexo/effect-adapter.test.mjs
      - name: Repair settlement crash-cut regressions
        run: node tests/nexo/repair-settlement-crash-cuts.test.mjs
