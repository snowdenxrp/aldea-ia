name: NCS Lúmina Decoupling Validation

on:
  push:
    branches:
      - ncs-lumina-decoupling-2026-10-29
  pull_request:
    branches:
      - ncs-clean-architecture
    paths:
      - "scripts/assistants.mjs"
      - "scripts/simulate.mjs"
      - "src/assistants/memory.js"
      - "tests/assistant-squad-audit.test.mjs"
      - "tests/assistant-cli-decoupling.test.mjs"
      - "tests/simulate-cli-decoupling.test.mjs"
      - "src/lumina/**"
      - "src/shared/effect-adapter.mjs"
      - "src/nexo/effect-adapter.js"
      - "tests/nexo/runtime.test.mjs"
      - "tests/nexo/simulation-adapter.test.mjs"
      - "tests/nexo/m0-import-graph-guard.test.mjs"
      - "package.json"
      - ".github/workflows/ncs-lumina-decoupling-validation.yml"

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run focused Lúmina/NCS regression
        run: node tests/assistant-squad-audit.test.mjs
      - name: Run repository test suite
        run: npm test
