name: Nexo — bounded mission admission and restart continuity

on:
  push:
    paths:
      - 'src/nexo/orchestrator.js'
      - 'src/assistants/memory.js'
      - 'tests/nexo/orchestrator.test.mjs'
      - 'tests/nexo/restart-reconstruction.test.mjs'
      - 'src/nexo/runtime.js'
      - 'src/nexo/effect-adapter.js'
      - 'tests/nexo/effect-adapter.test.mjs'
      - 'tests/nexo/runtime.test.mjs'
      - 'scripts/simulate.mjs'
      - 'tests/nexo/simulation-restart-persistence.test.mjs'
      - 'src/nexo/core/continuity-contract.mjs'
      - 'src/nexo/core/continuity-snapshot.mjs'
      - 'src/nexo/core/continuity-store.mjs'
      - 'src/nexo/core/continuity-owner.mjs'
      - 'src/nexo/core/continuity-operations.mjs'
      - 'scripts/nexo-continuity.mjs'
      - 'scripts/assistants.mjs'
      - 'tests/nexo/continuity-store.test.mjs'
      - 'tests/nexo/continuity-migration.test.mjs'
      - 'tests/nexo/continuity-contract.test.mjs'
      - '.github/workflows/nexo-mission-admission-continuity.yml'
  workflow_dispatch:

jobs:
  mission-admission-continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/nexo/orchestrator.test.mjs
      - run: node tests/nexo/runtime.test.mjs
      - run: node tests/nexo/effect-adapter.test.mjs
      - run: node tests/nexo/restart-reconstruction.test.mjs
      - run: node tests/nexo/simulation-restart-persistence.test.mjs
      - run: node tests/nexo/continuity-contract.test.mjs
      - run: node tests/nexo/continuity-store.test.mjs
      - run: node tests/nexo/continuity-migration.test.mjs
