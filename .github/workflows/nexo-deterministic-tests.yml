name: Nexo — deterministic persistence tests

on:
  push:
    branches: [main, ncs-clean-architecture]
  workflow_dispatch:

# Keep evidence-producing full-suite runs queued rather than cancelling the
# previous run on every commit. Isolate branches so unrelated refs do not cancel
# one another's persistence evidence.
concurrency:
  group: nexo-deterministic-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Run tests
        run: npm test
      - name: Bounded temporary cleanup regression
        run: node tests/nexo/temporary-cleanup-bounds.test.mjs
