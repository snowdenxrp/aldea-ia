name: Nexo — deterministic persistence tests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nexo-deterministic-tests
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Run tests
        run: npm test
