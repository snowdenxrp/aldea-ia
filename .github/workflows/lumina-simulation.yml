name: Lúmina — simulación persistente

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: lumina-simulation
  cancel-in-progress: false

jobs:
  simulate:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Actualizar estado')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Obtener Lúmina
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar asistentes de Lúmina
        run: npm test

      - name: Ejecutar diagnóstico de asistentes
        run: npm run assistants

      - name: Avanzar simulación
        run: npm run simulate

      - name: Guardar nuevo estado
        run: |
          git config user.name "lumina-simulation"
          git config user.email "lumina-simulation@users.noreply.github.com"
          git add world-state.json .lumina-assistant-memory.json
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
            exit 0
          fi
          git commit -m "Actualizar estado de Lúmina"
          git push
