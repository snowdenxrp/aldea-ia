name: Nexo M1 Android native prototype build

on:
  workflow_dispatch:
  push:
    branches:
      - ncs-clean-architecture
    paths:
      - "NEXO_NCS/M1_ANDROID/**"
      - ".github/workflows/nexo-m1-android-build.yml"

permissions:
  contents: read

concurrency:
  group: nexo-m1-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-prototype:
    name: Build and inspect M1 local inference APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          packages: ""

      - name: Install pinned Android build inputs
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
          yes | sdkmanager --licenses

      - name: Fetch and pin llama.cpp Android binding
        run: bash NEXO_NCS/M1_ANDROID/prepare-llama-android.sh

      - name: Assert pinned native source and prompt-log policy
        shell: bash
        run: |
          set -euo pipefail
          ROOT="NEXO_NCS/M1_ANDROID"
          EXPECTED="10a60cf303566e10d6a7a2774c17d2085503d87b"
          ACTUAL="$(git -C "$ROOT/llama.cpp" rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED"
          grep -Fq -- "-DCMAKE_CXX_FLAGS=-DLOG_MIN_LEVEL=ANDROID_LOG_ERROR" "$ROOT/llama-lib.build.gradle.kts"
          grep -Fq 'LOGi("%s: Formatted and added %s message:' "$ROOT/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp"
          grep -Fq "da2572f16c06133561ce56accaa822216f2391ef4d37fba427801cd6736417d4" "$ROOT/app/src/main/kotlin/org/nexo/m1/MainActivity.kt"
          mkdir -p "$ROOT/build-evidence"
          printf '%s\n' "$ACTUAL" > "$ROOT/build-evidence/llama-cpp-revision.txt"
          printf '%s\n' "Required native log floor: ANDROID_LOG_ERROR" > "$ROOT/build-evidence/native-log-policy.txt"

      - name: Build debug APK with native inference
        working-directory: NEXO_NCS/M1_ANDROID
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Assert native log floor was compiled in
        shell: bash
        run: |
          set -euo pipefail
          ROOT="NEXO_NCS/M1_ANDROID"
          COMPILE_DB="$(find "$ROOT/llama.cpp/examples/llama.android/lib/.cxx" -name compile_commands.json -print -quit)"
          test -n "$COMPILE_DB"
          grep -Fq -- "-DLOG_MIN_LEVEL=ANDROID_LOG_ERROR" "$COMPILE_DB"
          echo "Native prompt-bearing INFO/DEBUG/VERBOSE logging is filtered by the compiled log floor." >> "$ROOT/build-evidence/native-log-policy.txt"

      - name: Assert packaged APK does not declare INTERNET
        shell: bash
        run: |
          set -euo pipefail
          ROOT="NEXO_NCS/M1_ANDROID"
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | tee "$ROOT/build-evidence/m1-permissions.txt"
          if grep -q "android.permission.INTERNET" "$ROOT/build-evidence/m1-permissions.txt"; then
            echo "FAIL: INTERNET permission found in packaged APK"
            exit 1
          fi
          sha256sum "$APK" | tee "$ROOT/build-evidence/m1-apk.sha256"

      - name: Upload APK and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: nexo-m1-native-prototype-debug-apk
          path: |
            NEXO_NCS/M1_ANDROID/app/build/outputs/apk/debug/app-debug.apk
            NEXO_NCS/M1_ANDROID/build-evidence/*
          if-no-files-found: error
          retention-days: 14
