name: Nexo — STEP 7 policyContext contract

on:
  workflow_dispatch:
  push:
    paths:
      - src/nexo/core/contracts.mjs
      - tests/nexo/core-contracts.test.mjs
      - .github/workflows/nexo-step-7-policy-context.yml

jobs:
  policy-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/nexo/core-contracts.test.mjs
