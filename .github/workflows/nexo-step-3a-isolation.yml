name: Nexo — STEP 3A/3B/3C verification

on:
  push:
    branches: [main, ncs-clean-architecture]
    paths:
      - 'src/nexo/core/contracts.mjs'
      - 'src/nexo/core/ownership.mjs'
      - 'src/nexo/core/protected-transition.mjs'
      - 'src/nexo/core/conditional-commit-persist-state.mjs'
      - 'tests/nexo/core-contracts.test.mjs'
      - 'tests/nexo/protected-transition.test.mjs'
      - 'tests/nexo/conditional-commit-persist-state.test.mjs'
      - '.github/workflows/nexo-step-3a-isolation.yml'
  workflow_dispatch:

concurrency:
  group: nexo-step-3a-isolation
  cancel-in-progress: true

jobs:
  isolation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run STEP 3A isolation contract tests
        run: node tests/nexo/core-contracts.test.mjs
      - name: Run STEP 3B/3C protected-transition composition tests
        run: node tests/nexo/protected-transition.test.mjs
      - name: Run STEP 3C real persistState integration tests
        run: node tests/nexo/conditional-commit-persist-state.test.mjs
