name: NEXO AB105 G0 diagnostic cache snapshot probe

on:
  workflow_dispatch:

jobs:
  cache-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Nexo
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone pinned Kafka
        run: |
          git clone --filter=blob:none https://github.com/apache/kafka.git /tmp/kafka
          cd /tmp/kafka
          git checkout 99b940733a9f6bc409457dba7108f08421d81e42
          test "$(git rev-parse HEAD)" = "99b940733a9f6bc409457dba7108f08421d81e42"

      - name: Recover baseline G0 harness without changing it
        working-directory: /tmp/kafka
        run: |
          git -C "$GITHUB_WORKSPACE" fetch origin nexo-ab105-g0-ordering-witness:refs/remotes/origin/nexo-ab105-g0-ordering-witness

          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          workspace = os.environ["GITHUB_WORKSPACE"]

          src = subprocess.check_output([
              "git", "-C", workspace,
              "show",
              "origin/nexo-ab105-g0-ordering-witness:.github/workflows/nexo-ab105-g0-ordering-witness.yml"
          ], text=True)

          marker = "cat > server/src/test/java/org/apache/kafka/server/NexoG0OrderingWitnessTest.java <<'EOF'"
          start = src.index(marker) + len(marker) + 1
          end = src.index("\n          EOF", start)
          test = src[start:end]

          test_path = Path(
              "server/src/test/java/org/apache/kafka/server/NexoG0OrderingWitnessTest.java"
          )
          test_path.parent.mkdir(parents=True, exist_ok=True)
          test_path.write_text(test)

          cache = Path(
              "metadata/src/main/java/org/apache/kafka/metadata/authorizer/AclCache.java"
          )
          cs = cache.read_text()

          cache_marker = "    AclCache removeAcl(Uuid id) {"

          cache_method = (
              "    java.util.Optional<Uuid> nexoFindId(StandardAcl target) {\n"
              "        Uuid[] found = new Uuid[1];\n"
              "        aclsById.forEach((id, acl) -> {\n"
              "            if (acl.equals(target)) found[0] = id;\n"
              "        });\n"
              "        return java.util.Optional.ofNullable(found[0]);\n"
              "    }\n\n"
          )

          if cs.count(cache_marker) != 1:
              raise SystemExit("AclCache injection marker mismatch")

          cs = cs.replace(cache_marker, cache_method + cache_marker, 1)
          cache.write_text(cs)

          p = Path(
              "metadata/src/main/java/org/apache/kafka/metadata/authorizer/StandardAuthorizerData.java"
          )
          s = p.read_text()

          old_w1 = (
              "            AclCache aclCacheSnapshot = aclCache.removeAcl(id);\n"
              "            log.trace(\"Removed ACL {}: {}\", id, aclCacheSnapshot.getAcl(id));\n"
              "            aclCache = aclCacheSnapshot;"
          )

          new_w1 = (
              "            AclCache aclCacheSnapshot = aclCache.removeAcl(id);\n"
              "            log.trace(\"Removed ACL {}: {}\", id, aclCacheSnapshot.getAcl(id));\n"
              "            aclCache = aclCacheSnapshot;\n"
              "            try {\n"
              "                java.nio.file.Files.writeString(\n"
              "                    java.nio.file.Path.of(\"/tmp/nexo-w1-cache.log\"),\n"
              "                    \"NEXO_CACHE W1 ns=\" + System.nanoTime() +\n"
              "                        \" thread=\" + Thread.currentThread().getName() +\n"
              "                        \" id=\" + id +\n"
              "                        \" cacheIdentity=\" + System.identityHashCode(aclCache) +\n"
              "                        \" cacheCount=\" + aclCache.count() +\n"
              "                        System.lineSeparator(),\n"
              "                    java.nio.file.StandardOpenOption.CREATE,\n"
              "                    java.nio.file.StandardOpenOption.APPEND\n"
              "                );\n"
              "            } catch (java.io.IOException e) {\n"
              "                throw new RuntimeException(\"NEXO_CACHE W1 probe sink failed\", e);\n"
              "            }"
          )

          if s.count(old_w1) != 1:
              raise SystemExit("W1 insertion marker mismatch")

          s = s.replace(old_w1, new_w1, 1)

          old_d1 = (
              "        AclCache aclCacheSnapshot = aclCache;\n"
              "        checkSection(aclCacheSnapshot, action, exemplar, matchingPrincipals, host, matchingRuleBuilder);"
          )

          new_d1 = (
              "        AclCache aclCacheSnapshot = aclCache;\n"
              "        if (\"nexo-g0-ordering\".equals(action.resourcePattern().name())\n"
              "                && action.resourcePattern().resourceType() == org.apache.kafka.common.resource.ResourceType.TOPIC\n"
              "                && action.operation() == org.apache.kafka.common.acl.AclOperation.WRITE) {\n"
              "            StandardAcl targetAcl = new StandardAcl(\n"
              "                org.apache.kafka.common.resource.ResourceType.TOPIC,\n"
              "                \"nexo-g0-ordering\",\n"
              "                org.apache.kafka.common.resource.PatternType.LITERAL,\n"
              "                \"User:plain-user1\",\n"
              "                \"*\",\n"
              "                org.apache.kafka.common.acl.AclOperation.WRITE,\n"
              "                org.apache.kafka.common.acl.AclPermissionType.ALLOW\n"
              "            );\n"
              "\n"
              "            boolean targetPresent = aclCacheSnapshot.aclsByResource().contains(targetAcl);\n"
              "            String targetId = aclCacheSnapshot.nexoFindId(targetAcl)\n"
              "                .map(Object::toString)\n"
              "                .orElse(\"NONE\");\n"
              "\n"
              "            try {\n"
              "                java.nio.file.Files.writeString(\n"
              "                    java.nio.file.Path.of(\"/tmp/nexo-d1-cache.log\"),\n"
              "                    \"NEXO_CACHE D1 ns=\" + System.nanoTime() +\n"
              "                        \" thread=\" + Thread.currentThread().getName() +\n"
              "                        \" cacheIdentity=\" + System.identityHashCode(aclCacheSnapshot) +\n"
              "                        \" cacheCount=\" + aclCacheSnapshot.count() +\n"
              "                        \" targetPresent=\" + targetPresent +\n"
              "                        \" targetId=\" + targetId +\n"
              "                        System.lineSeparator(),\n"
              "                    java.nio.file.StandardOpenOption.CREATE,\n"
              "                    java.nio.file.StandardOpenOption.APPEND\n"
              "                );\n"
              "            } catch (java.io.IOException e) {\n"
              "                throw new RuntimeException(\"NEXO_CACHE D1 probe sink failed\", e);\n"
              "            }\n"
              "        }\n"
              "\n"
              "        checkSection(aclCacheSnapshot, action, exemplar, matchingPrincipals, host, matchingRuleBuilder);"
          )

          if s.count(old_d1) != 1:
              raise SystemExit("D1 insertion marker mismatch")

          s = s.replace(old_d1, new_d1, 1)
          p.write_text(s)
          PY

      - name: Probe safety audit
        working-directory: /tmp/kafka
        run: |
          echo "---- INJECTED DIAGNOSTIC SAFETY AUDIT ----"

          for token in volatile Atomic CountDownLatch Future synchronized Reentrant Semaphore Lock; do
            if grep -n -F -- "$token" \
                metadata/src/main/java/org/apache/kafka/metadata/authorizer/AclCache.java \
                metadata/src/main/java/org/apache/kafka/metadata/authorizer/StandardAuthorizerData.java; then
              echo "Injected diagnostic source contains forbidden synchronization token: $token"
              exit 1
            fi
          done

          grep -F -q -- 'nexoFindId' \
            metadata/src/main/java/org/apache/kafka/metadata/authorizer/AclCache.java \
            || { echo "nexoFindId injection missing"; exit 1; }

          grep -F -q -- 'targetId' \
            metadata/src/main/java/org/apache/kafka/metadata/authorizer/StandardAuthorizerData.java \
            || { echo "targetId diagnostic missing"; exit 1; }

          grep -F -q -- 'NEXO_CACHE W1' \
            metadata/src/main/java/org/apache/kafka/metadata/authorizer/StandardAuthorizerData.java \
            || { echo "W1 diagnostic marker missing"; exit 1; }

          grep -F -q -- 'NEXO_CACHE D1' \
            metadata/src/main/java/org/apache/kafka/metadata/authorizer/StandardAuthorizerData.java \
            || { echo "D1 diagnostic marker missing"; exit 1; }

          grep -n -F -- 'AclCache aclCacheSnapshot = aclCache' \
            metadata/src/main/java/org/apache/kafka/metadata/authorizer/StandardAuthorizerData.java

          grep -n -F -- 'targetPresent' \
            metadata/src/main/java/org/apache/kafka/metadata/authorizer/StandardAuthorizerData.java

          grep -n -F -- 'cacheIdentity' \
            metadata/src/main/java/org/apache/kafka/metadata/authorizer/StandardAuthorizerData.java

          grep -n -F -- 'cacheCount' \
            metadata/src/main/java/org/apache/kafka/metadata/authorizer/StandardAuthorizerData.java

          grep -n -F -- 'nexo-w1-cache.log' \
            metadata/src/main/java/org/apache/kafka/metadata/authorizer/StandardAuthorizerData.java

          grep -n -F -- 'nexo-d1-cache.log' \
            metadata/src/main/java/org/apache/kafka/metadata/authorizer/StandardAuthorizerData.java

      - name: Compile
        working-directory: /tmp/kafka
        run: |
          ./gradlew --no-daemon \
            :test-common:test-common-runtime:compileJava \
            :metadata:compileTestJava \
            :server:compileTestJava

      - name: Execute real broker diagnostic
        working-directory: /tmp/kafka
        run: |
          set -o pipefail
          ./gradlew --no-daemon \
            :server:test \
            --tests org.apache.kafka.server.NexoG0OrderingWitnessTest \
            -x :server:checkstyleTest \
            --info 2>&1 | tee /tmp/nexo-cache-probe.log

      - name: Emit diagnostic evidence
        if: always()
        working-directory: /tmp/kafka
        run: |
          {
            echo "KAFKA_REV=$(git rev-parse HEAD)"
            echo "DIAGNOSTIC=REAL_BROKER_D1_ACLCACHE_SNAPSHOT"
            echo "TIMING_INSTRUMENTATION=WORKFLOW_LOCAL"
            echo "W1_AND_D1_SINKS=SEPARATE_FILES"
            echo "AB105_116R=UNCHANGED"
            echo "AB105_117R=NOT_CREATED"
            echo "TLC=NOT_RERUN"

            echo "---- W1 CACHE EVENTS ----"
            cat /tmp/nexo-w1-cache.log 2>/dev/null || true

            echo "---- D1 CACHE EVENTS ----"
            cat /tmp/nexo-d1-cache.log 2>/dev/null || true

            echo "---- BASELINE ORDER EVENTS ----"
            grep 'NEXO_ORDER ' /tmp/nexo-cache-probe.log || true
          } | tee /tmp/nexo-cache-probe-evidence.txt

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-ab105-g0-cache-probe
          path: |
            /tmp/nexo-cache-probe.log
            /tmp/nexo-cache-probe-evidence.txt
            /tmp/nexo-w1-cache.log
            /tmp/nexo-d1-cache.log
