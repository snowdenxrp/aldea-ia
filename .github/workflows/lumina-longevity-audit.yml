name: Lúmina — auditoría de longevidad

on:
  push:
    branches:
      - "audit/longevity-2026-09-19"

permissions:
  contents: read

jobs:
  longevity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener Lúmina
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ejecutar pruebas existentes
        run: npm test

      - name: Ejecutar auditoría de 100, 500 y 1000 días
        run: node scripts/longevity-audit.mjs
