name: NEXO AB105 G0 visibility witness

on:
  push:
    branches:
      - nexo-ab105-g0-visibility-probe
    paths:
      - ".github/workflows/nexo-ab105-g0-visibility-witness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visibility-witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structural witness gate
        run: |
          echo "VISIBILITY_WORKFLOW_STRUCTURAL_GATE=PASS"
          echo "SOURCE=$GITHUB_SHA"
          echo "AB105_116R=FROZEN"
          echo "AB105_117R=NOT_CREATED"
          echo "TLC=NOT_RERUN"
