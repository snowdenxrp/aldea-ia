name: Nexo — STEP 4 semantic validation

on:
  push:
    paths:
      - 'src/nexo/core/**'
      - 'tests/nexo/**'
      - 'NEXO_NCS/BUILD/STEP_4*'
      - '.github/workflows/nexo-step-4-semantic-validation.yml'
  workflow_dispatch:

jobs:
  semantic-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/nexo/final-semantic-validator.test.mjs

# Runtime verification trigger retained; logic unchanged.
